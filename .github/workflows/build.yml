name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ATIS.slnx

      - name: Build
        run: dotnet build ATIS.slnx --no-restore --configuration Release -p:Version=10.6.0.${{ github.run_number }}

      - name: Check outdated NuGet packages
        run: dotnet list ATIS.slnx package --outdated