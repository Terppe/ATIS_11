name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set CI Version
        shell: pwsh
        run: |
          "ATIS_VERSION=11.0.0.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Show CI Version
        shell: pwsh
        run: |
          Write-Host "ATIS_VERSION=$env:ATIS_VERSION"

      - name: Restore
        run: dotnet restore ATIS/ATIS.csproj -p:Platform=x64 --force

      - name: Build
        run: dotnet build ATIS/ATIS.csproj --no-restore -c Release -p:Platform=x64 -p:Version=${{ env.ATIS_VERSION }} -p:InformationalVersion=${{ env.ATIS_VERSION }}

      - name: Build Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:ATIS_VERSION" Installer\ATIS.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ATIS-Setup-${{ env.ATIS_VERSION }}
          path: Installer/Output/*.exe