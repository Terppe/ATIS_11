name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set CI Version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = "11.0.0.${{ github.run_number }}"
          }
          "ATIS_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Show CI Version
        shell: pwsh
        run: |
          Write-Host "ATIS_VERSION=$env:ATIS_VERSION"

      - name: Restore
        run: dotnet restore ATIS/ATIS.csproj -p:Platform=x64 --force

      - name: Build
        run: dotnet build ATIS/ATIS.csproj --no-restore -c Release -p:Platform=x64 -p:Version=${{ env.ATIS_VERSION }} -p:InformationalVersion=${{ env.ATIS_VERSION }}

      - name: Build Installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$env:ATIS_VERSION" "/DMyPathBin=ATIS\bin\x64\Release\net10.0-windows10.0.26100.0\" Installer\ATIS.iss

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: ATIS-Setup-${{ env.ATIS_VERSION }}
          path: Installer/Output/*.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Installer/Output/*.exe
          generate_release_notes: true